name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: alpha-factor-forge
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: alpha-factor-forge/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

      # Production dependencies only (maintainer decision 2026-10-04, FU-3c):
      # fails on any advisory npm reports for them. devDependencies are not
      # covered here; they are triaged by hand per docs/security-audit-npm.md,
      # which also forbids `npm audit fix`. A registry outage fails this step
      # too: rerun the job rather than skipping the check.
      - name: Audit production dependencies
        run: npm audit --omit=dev

  test:
    name: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: alpha-factor-forge
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: alpha-factor-forge/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build:
    name: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: alpha-factor-forge
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: alpha-factor-forge/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  cargo-check:
    name: cargo-check
    runs-on: windows-latest
    defaults:
      run:
        working-directory: alpha-factor-forge/src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check Tauri backend
        run: cargo check --locked

      - name: Run backend tests
        run: cargo test --locked

  # CI-TAURI-SMOKE-001a — the first lane that builds and RUNS the real desktop
  # binary. Everything before it stopped short of that: `cargo check`/`cargo test`
  # never link the app, and the Playwright suite drives the React tree against the
  # in-memory `?mock=1` client, so no lane had ever proved the app starts on a
  # clean machine. This one links the binary, launches it, and asserts the startup
  # path it cannot fake — a real WebView2 render plus the SQLite database that
  # `setup` creates, migrates, and runs orphan recovery against.
  #
  # Slice b adds real invoke/event round trips via existing Playwright's WebView2
  # CDP support. The debug build enables the existing isolated test-registry seam;
  # unique temp workspace/registry/profile paths keep the smoke off user data.
  native-smoke:
    name: native-smoke
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: alpha-factor-forge/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        working-directory: alpha-factor-forge
        run: npm ci

      # `beforeBuildCommand` in tauri.conf.json runs `npm run build`, so the
      # frontend bundle is produced by this step too — no separate build needed.
      - name: Build the native desktop binary
        working-directory: alpha-factor-forge
        run: npm run tauri -- build --debug --no-bundle

      - name: Smoke the built binary
        shell: pwsh
        run: ./alpha-factor-forge/scripts/native-smoke.ps1

      - name: Upload native smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-smoke-evidence
          path: alpha-factor-forge/test-results/native-smoke/
          if-no-files-found: ignore

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: alpha-factor-forge
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: alpha-factor-forge/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      - name: Run E2E (chromium)
        run: npx playwright test
